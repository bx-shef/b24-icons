<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bx24 icons</title>
<meta name="description" content="Иконки Bitrix24 как коллекция Iconify bx24: поиск, темы, имена для Nuxt, Vue, React и SVG.">
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1f2329; --muted: #687280; --line: #e3e6ea;
    --accent: #2067b0; --accent-soft: #e5f0fb; --tile: #fff; --code: #f1f3f5;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171b; --panel: #1c2025; --text: #e6e8eb; --muted: #9aa2ad; --line: #2d333a;
      --accent: #5ea2e8; --accent-soft: #1f3247; --tile: #21262c; --code: #262c33;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--accent); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  header h1 small { font-weight: 400; color: var(--muted); }
  header input[type=search] { flex: 1; min-width: 200px; max-width: 520px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  header nav { display: flex; gap: 14px; margin-left: auto; font-size: 13px; }
  .layout { display: grid; grid-template-columns: 240px 1fr; align-items: start; }
  aside { position: sticky; top: 64px; max-height: calc(100vh - 64px); overflow: auto; padding: 12px 8px 24px; border-right: 1px solid var(--line); }
  .group { margin: 12px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .filter { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  .filter:hover { background: var(--accent-soft); }
  .filter[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .filter span:last-child { opacity: .7; font-size: 12px; }
  main { padding: 16px 20px 40px; min-width: 0; }
  .summary { color: var(--muted); margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .tile { background: var(--tile); border: 1px solid var(--line); border-radius: 8px; padding: 12px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; font: inherit; color: inherit; }
  .tile:hover, .tile:focus-visible { border-color: var(--accent); outline: none; }
  .tile svg { width: 32px; height: 32px; }
  .tile span { font-size: 11px; color: var(--muted); text-align: center; word-break: break-all; line-height: 1.25; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }
  .more { display: block; margin: 16px auto 0; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(640px, calc(100vw - 32px)); background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  .dlg-head { display: flex; gap: 16px; align-items: center; padding: 20px; border-bottom: 1px solid var(--line); }
  .dlg-head .preview { width: 96px; height: 96px; display: grid; place-items: center; background: var(--bg); border-radius: 10px; flex: none; }
  .dlg-head .preview svg { width: 64px; height: 64px; }
  .dlg-head h2 { margin: 0 0 4px; font-size: 17px; word-break: break-all; }
  .dlg-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .close { margin-left: auto; align-self: flex-start; font: inherit; font-size: 20px; line-height: 1; color: var(--muted); background: none; border: 0; cursor: pointer; }
  .rows { padding: 12px 20px 20px; display: grid; gap: 10px; }
  .row { min-width: 0; }
  .row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .copy { display: flex; gap: 6px; }
  .copy code { flex: 1; min-width: 0; overflow-x: auto; white-space: pre; background: var(--code); border-radius: 6px; padding: 7px 10px; font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .copy button, .actions a, .actions button { font: inherit; font-size: 13px; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; text-decoration: none; }
  .copy button:hover, .actions a:hover, .actions button:hover { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .menu-toggle { display: none; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); display: none; }
    aside.open { display: block; }
    .menu-toggle { display: inline-block; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
    header nav { margin-left: 0; }
    main { padding: 12px 16px 32px; }
  }
</style>
</head>
<body>
<header>
  <h1>bx24 icons <small id="total"></small></h1>
  <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="filters">Темы</button>
  <input type="search" id="search" placeholder="Поиск: arrow, chat, file…  ( / )" aria-label="Поиск иконок">
  <nav>
    <a href="https://github.com/bx-shef/b24-icons#usage">Как подключить</a>
    <a href="https://www.npmjs.com/package/@bxshefby/icons-json">npm</a>
    <a href="https://github.com/bx-shef/b24-icons">GitHub</a>
  </nav>
</header>
<div class="layout">
  <aside id="filters" aria-label="Фильтры"></aside>
  <main>
    <p class="summary" id="summary">Загрузка…</p>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" type="button" hidden>Показать ещё</button>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <div class="preview" id="dlg-preview"></div>
    <div>
      <h2 id="dlg-title"></h2>
      <p id="dlg-meta"></p>
    </div>
    <button class="close" type="button" id="dlg-close" aria-label="Закрыть">×</button>
  </div>
  <div class="rows" id="dlg-rows"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const PREFIX = 'bx24'
const PAGE = 240
const state = { icons: [], categories: {}, sets: [], theme: '', set: '', q: '', limit: PAGE }
const $ = id => document.getElementById(id)
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

function svgOf(icon, name, size) {
  const body = icon.body
    .replace(/\bid="([^"]+)"/g, `id="${name}-$1"`)
    .replace(/url\(#([^)]+)\)/g, `url(#${name}-$1)`)
    .replace(/href="#([^"]+)"/g, `href="#${name}-$1"`)
  const vb = `${icon.left || 0} ${icon.top || 0} ${icon.width} ${icon.height}`
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"${size ? ` width="${size}" height="${size}"` : ''} aria-hidden="true">${body}</svg>`
}

function standaloneSvg(icon) {
  const vb = `${icon.left || 0} ${icon.top || 0} ${icon.width} ${icon.height}`
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${icon.width}" height="${icon.height}" viewBox="${vb}">${icon.body}</svg>`
}

// ---------- state <-> URL ----------
function readUrl() {
  const p = new URLSearchParams(location.hash.slice(1))
  state.q = p.get('q') || ''
  state.theme = p.get('theme') || ''
  state.set = p.get('set') || ''
  $('search').value = state.q
  return p.get('icon')
}
function writeUrl(icon) {
  const p = new URLSearchParams()
  if (state.q) p.set('q', state.q)
  if (state.theme) p.set('theme', state.theme)
  if (state.set) p.set('set', state.set)
  if (icon) p.set('icon', icon)
  const hash = p.toString()
  history.replaceState(null, '', hash ? '#' + hash : location.pathname)
}

// ---------- rendering ----------
function filtered() {
  const words = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean)
  const inTheme = state.theme ? new Set(state.categories[state.theme] || []) : null
  return state.icons.filter(i =>
    (!inTheme || inTheme.has(i.name)) &&
    (!state.set || i.set === state.set) &&
    words.every(w => i.name.includes(w) || i.themes.some(t => t.toLowerCase().includes(w))))
}

function renderFilters() {
  const btn = (kind, value, title, count) =>
    `<button class="filter" type="button" data-${kind}="${esc(value)}" aria-pressed="${(kind === 'theme' ? state.theme : state.set) === value}"><span>${esc(title)}</span><span>${count}</span></button>`
  $('filters').innerHTML =
    `<div class="group">Темы</div>` +
    btn('theme', '', 'Все иконки', state.icons.length) +
    Object.entries(state.categories).map(([t, list]) => btn('theme', t, t, list.length)).join('') +
    `<div class="group">Наборы</div>` +
    btn('set', '', 'Все наборы', state.icons.length) +
    state.sets.map(s => btn('set', s, s, state.icons.filter(i => i.set === s).length)).join('')
}

function renderGrid() {
  const list = filtered()
  const shown = list.slice(0, state.limit)
  const parts = [state.theme && `тема «${state.theme}»`, state.set && `набор ${state.set}`, state.q && `«${state.q}»`].filter(Boolean)
  $('summary').textContent = `${list.length} ${plural(list.length)}${parts.length ? ' · ' + parts.join(', ') : ''}`
  $('grid').innerHTML = shown.length
    ? shown.map(i => `<button class="tile" type="button" data-name="${i.name}" title="${esc(i.name)}">${i.svg}<span>${esc(i.name)}</span></button>`).join('')
    : '<div class="empty">Ничего не найдено. Попробуйте другое слово или сбросьте фильтры.</div>'
  $('more').hidden = list.length <= state.limit
  $('more').textContent = `Показать ещё (${list.length - shown.length})`
}

function plural(n) {
  const m10 = n % 10, m100 = n % 100
  if (m10 === 1 && m100 !== 11) return 'иконка'
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'иконки'
  return 'иконок'
}

function render() { renderFilters(); renderGrid() }

// ---------- details ----------
function open(name) {
  const i = state.icons.find(x => x.name === name)
  if (!i) return
  $('dlg-preview').innerHTML = svgOf(i.icon, i.name + '-big')
  $('dlg-title').textContent = i.name
  $('dlg-meta').textContent = `набор ${i.set} · ${i.icon.width}×${i.icon.height}` + (i.themes.length ? ` · ${i.themes.join(', ')}` : '')
  const rows = [
    ['Nuxt, Nuxt UI, b24-ui', `i-${PREFIX}-${i.name}`],
    ['Iconify (Vue, React, iconify-icon)', `${PREFIX}:${i.name}`],
    ['Nuxt UI', `<UIcon name="i-${PREFIX}-${i.name}" class="size-5" />`],
    ['Vue (@iconify/vue)', `<Icon icon="${PREFIX}:${i.name}" />`],
    ['React (@iconify/react)', `<Icon icon="${PREFIX}:${i.name}" />`],
    ['SVG', standaloneSvg(i.icon)]
  ]
  $('dlg-rows').innerHTML = rows.map(([label, value], n) => `
    <div class="row"><label>${esc(label)}</label>
      <div class="copy"><code>${esc(value)}</code><button type="button" data-copy="${n}">Копировать</button></div>
    </div>`).join('') +
    `<div class="actions"><a href="#" id="dl" download="${esc(i.name)}.svg">Скачать SVG</a></div>`
  $('dlg-rows').dataset.values = JSON.stringify(rows.map(r => r[1]))
  const blob = new Blob([standaloneSvg(i.icon) + '\n'], { type: 'image/svg+xml' })
  $('dl').href = URL.createObjectURL(blob)
  writeUrl(name)
  if (!$('dlg').open) $('dlg').showModal()
}

function toast(text) {
  const t = $('toast')
  t.textContent = text
  t.classList.add('show')
  clearTimeout(toast.timer)
  toast.timer = setTimeout(() => t.classList.remove('show'), 1400)
}

// ---------- events ----------
$('grid').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) open(t.dataset.name) })
$('filters').addEventListener('click', e => {
  const b = e.target.closest('.filter')
  if (!b) return
  if ('theme' in b.dataset) state.theme = b.dataset.theme
  if ('set' in b.dataset) state.set = b.dataset.set
  state.limit = PAGE
  writeUrl(); render()
  $('filters').classList.remove('open'); $('menu-toggle').setAttribute('aria-expanded', 'false')
  window.scrollTo({ top: 0 })
})
let searchTimer
$('search').addEventListener('input', e => {
  clearTimeout(searchTimer)
  searchTimer = setTimeout(() => { state.q = e.target.value; state.limit = PAGE; writeUrl(); renderGrid() }, 120)
})
$('more').addEventListener('click', () => { state.limit += PAGE * 2; renderGrid() })
$('menu-toggle').addEventListener('click', () => {
  const open = $('filters').classList.toggle('open')
  $('menu-toggle').setAttribute('aria-expanded', String(open))
})
$('dlg-close').addEventListener('click', () => $('dlg').close())
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close() })
$('dlg').addEventListener('close', () => writeUrl())
$('dlg-rows').addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]')
  if (!b) return
  const value = JSON.parse($('dlg-rows').dataset.values)[Number(b.dataset.copy)]
  try { await navigator.clipboard.writeText(value); toast('Скопировано') } catch { toast('Не удалось скопировать') }
})
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && !$('dlg').open) { e.preventDefault(); $('search').focus() }
})

// ---------- boot ----------
async function boot() {
  const [icons, metadata] = await Promise.all([fetch('icons.json').then(r => r.json()), fetch('metadata.json').then(r => r.json())])
  const W = icons.width || 16, H = icons.height || 16
  const prefixes = Object.keys(metadata.prefixes || {}).map(p => p.replace(/-$/, ''))
  state.sets = prefixes
  const themesOf = {}
  for (const [t, list] of Object.entries(metadata.categories || {})) for (const n of list) (themesOf[n] ||= []).push(t)
  state.categories = metadata.categories || {}
  state.icons = Object.entries(icons.icons)
    .filter(([, icon]) => !icon.hidden)
    .map(([name, raw]) => {
      const icon = { ...raw, width: raw.width || W, height: raw.height || H }
      const set = prefixes.filter(s => name.startsWith(s + '-')).sort((a, b) => b.length - a.length)[0] || ''
      return { name, set, icon, themes: themesOf[name] || [], svg: svgOf(icon, name) }
    })
    .sort((a, b) => prefixes.indexOf(a.set) - prefixes.indexOf(b.set) || a.name.localeCompare(b.name))
  $('total').textContent = `· ${state.icons.length}`
  const icon = readUrl()
  render()
  if (icon) open(icon)
}
boot().catch(e => { $('summary').textContent = 'Не удалось загрузить коллекцию: ' + e.message })
window.addEventListener('hashchange', () => { readUrl(); render() })
</script>
</body>
</html>
