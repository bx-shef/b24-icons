# Каталог иконок внутри контейнера. TLS и домен — у общего прокси сервера (deploy/README.md).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Неизвестный адрес — страница 404 каталога (Nuxt), а не голый ответ nginx
    error_page 404 /404.html;

    gzip on;
    gzip_types application/json image/svg+xml text/css application/javascript;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Наружу — только Яндекс Метрика после согласия на cookie; встроенные скрипт и стили — от Nuxt.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        try_files /index.html =404;
    }
    # Коллекция меняется с каждым образом: браузер переспрашивает, но по ETag получает 304.
    location ~ \.json$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Сборка Nuxt: файлы с хешем в имени не меняются
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/index.html =404;
    }
}
