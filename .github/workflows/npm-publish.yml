name: NPM publish

# Публикует @bxshefby/icons-json, @bxshefby/icons-svg и @bxshefby/icons-migrate через OIDC
# (trusted publishing) с provenance. В Trusted Publisher каждого из трёх пакетов на npmjs.com
# указано имя ЭТОГО файла (npm-publish.yml) и окружение npm-release — не переименовывать.
#
# Запуск: release-please.yml после слияния PR выпуска (на теге) или вручную (Run workflow) на теге v*.
# Сборка отделена от публикации: install-скрипты зависимостей выполняются в job без id-token,
# в job публикации приходят только готовые tarball и их sha256.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  PACKAGES: icons-json icons-svg icons-migrate

jobs:
  build:
    if: >
      github.repository == 'bx-shef/b24-icons' && vars.NPM_RELEASE == 'true' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      checksums: ${{ steps.pack.outputs.checksums }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify versions match the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          EXPECTED="${TAG#v}"
          for f in package.json $(printf 'packages/%s/package.json ' $PACKAGES); do
            ACTUAL=$(jq -r .version "$f")
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::$f has version $ACTUAL, tag is $TAG"; exit 1; }
          done
          echo "All packages at $EXPECTED"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Pack
        id: pack
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$OUT"
          for p in $PACKAGES; do
            (cd "packages/$p" && pnpm pack --pack-destination "$OUT" >/dev/null)
          done
          ls -la "$OUT"
          test "$(find "$OUT" -name '*.tgz' | wc -l)" -eq 3 || { echo "::error::expected 3 tarballs"; exit 1; }
          for t in "$OUT"/*.tgz; do
            tar -xzOf "$t" package/package.json | node -e '
              const p = JSON.parse(require("fs").readFileSync(0, "utf8"))
              for (const f of ["dependencies", "peerDependencies", "optionalDependencies"])
                for (const [n, r] of Object.entries(p[f] || {}))
                  if (/^(workspace|catalog):/.test(r)) { console.error(`::error::${p.name}: unresolved ${f}.${n}@${r}`); process.exit(1) }
              console.log(`${p.name}@${p.version} OK`)'
          done
          { echo "checksums<<EOF"; (cd "$OUT" && sha256sum *.tgz); echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Upload tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Окружение npm-release (Settings → Environments) пускает только main и теги v*; то же имя задано
    # в Trusted Publisher пакетов на npmjs.com.
    environment: npm-release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      - name: Verify checksums
        working-directory: ${{ runner.temp }}/npm-tarballs
        env:
          CHECKSUMS: ${{ needs.build.outputs.checksums }}
        run: printf '%s\n' "$CHECKSUMS" | sha256sum -c -

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
        run: npm install -g --ignore-scripts npm@11.21.2

      - name: Publish
        shell: bash
        working-directory: ${{ runner.temp }}/npm-tarballs
        run: |
          # По порядку PACKAGES (icons-json первым). Уже опубликованное пропускается, поэтому
          # упавшую публикацию можно просто перезапустить.
          for p in $PACKAGES; do
            t=$(ls bxshefby-$p-*.tgz)
            NAME=$(tar -xzOf "$t" package/package.json | jq -r .name)
            VER=$(tar -xzOf "$t" package/package.json | jq -r .version)
            if npm view "$NAME@$VER" version >/dev/null 2>&1; then
              echo "$NAME@$VER is already published, skipping"
              continue
            fi
            TAG_ARGS=()
            [[ "$VER" == *-* ]] && TAG_ARGS=(--tag next)
            npm publish "$t" --provenance --access public --ignore-scripts "${TAG_ARGS[@]}"
          done
