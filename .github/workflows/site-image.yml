name: site-image

# Образ публичного каталога (deploy/Dockerfile) в ghcr.io/bx-shef/b24-icons-site.
# На PR — сборка и дымовая проверка, на push в main — ещё и публикация; на сервер образ ставит
# общий Watchtower. Сервер — deploy/README.md. Адрес сайта — переменная SITE_URL или секрет DOCS_SITE_URL, Метрика — секрет YANDEX_METRIKA_ID. Схема та же, что docs-image.yml в bx-shef/b24-js-sdk.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    if: github.repository == 'bx-shef/b24-icons'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Собрать образ
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: b24-icons-site:ci
          build-args: |
            SITE_URL=${{ vars.SITE_URL || secrets.DOCS_SITE_URL }}
            YANDEX_METRIKA_ID=${{ secrets.YANDEX_METRIKA_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Дымовая проверка
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.DOCS_SITE_URL }}
          YANDEX_METRIKA_ID: ${{ secrets.YANDEX_METRIKA_ID }}
        run: |
          # Те же ограничения, что в deploy/docker-compose.prod.yml: только чтение, без прав.
          docker run -d --name site --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8080:8080 b24-icons-site:ci
          for _ in $(seq 1 30); do curl -fs localhost:8080/ >/dev/null && break; sleep 1; done
          check() { got=$(curl -s -o /dev/null -w '%{http_code}' "${@:2}"); echo "$1 → $got"; [ "$1" = "$got" ]; }
          check 200 localhost:8080/
          check 200 localhost:8080/data/icons.json
          check 200 localhost:8080/data/search.json
          check 200 localhost:8080/svg/outline-check-l.svg
          check 404 localhost:8080/nope
          # неизвестный адрес — страница 404 каталога, а не голый ответ nginx
          curl -s -o nope.html localhost:8080/nope
          grep -q '_nuxt' nope.html || { echo "::error::404 — не страница каталога"; exit 1; }
          # файлы иконок — валидный XML (раньше был двойной xmlns, браузер их не открывал)
          curl -fs -o check.svg localhost:8080/svg/outline-check-l.svg
          python3 -c 'import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])' check.svg || { echo "::error::SVG невалиден"; exit 1; }
          # Ответы — в файлы: `curl | grep -q` обрывает канал на первом совпадении, и curl падает.
          curl -fs -o icons.json localhost:8080/data/icons.json
          grep -q '"prefix": *"bx24"' icons.json || { echo "::error::icons.json без prefix bx24"; exit 1; }
          curl -fs -D headers.txt -o index.html localhost:8080/
          grep -qi '^content-security-policy:' headers.txt || { echo "::error::нет CSP"; exit 1; }
          grep -q 'bx24' index.html || { echo "::error::страница каталога не собрана"; exit 1; }
          if [ -n "$SITE_URL" ]; then
            # адрес из секрета, который не разобрался, сборка пропускает с предупреждением (scripts/site.mjs)
            if grep -q 'rel="canonical"' index.html; then check 200 localhost:8080/sitemap.xml; else echo "::warning::SITE_URL / DOCS_SITE_URL не разобран — сайт без canonical и sitemap"; fi
          fi
          # номер Метрики, вшитый при сборке, дошёл до страницы (runtimeConfig в разметке)
          if [ -n "$YANDEX_METRIKA_ID" ]; then
            grep -q "$YANDEX_METRIKA_ID" index.html || { echo "::error::номера Метрики нет на странице"; exit 1; }
            check 200 localhost:8080/cookie-consent.js
          fi
          docker rm -f site

      - name: Журнал контейнера при сбое
        if: failure()
        run: docker logs site || true

      - name: Вход в GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метки образа
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bx-shef/b24-icons-site
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Опубликовать
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL || secrets.DOCS_SITE_URL }}
            YANDEX_METRIKA_ID=${{ secrets.YANDEX_METRIKA_ID }}
          cache-from: type=gha
