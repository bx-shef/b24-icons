# Actions закреплены по SHA, поэтому без бота закрепление устаревает. Dependabot двигает
# SHA и переписывает комментарий с версией; зависимости npm обновляет так же.
# Репозиторий не следует за чужим upstream (в отличие от bx-shef/b24-js-sdk и
# bx-shef/b24-ui, где версии приходят синхронизацией и свои PR выключены), поэтому
# обновления здесь ведёт сам Dependabot.
#
# Группы держат очередь короткой: один PR на экосистему, а не по PR на пакет.
# Основные (major) версии в группу не попадают и приходят отдельными PR — их
# просматривают вручную. cooldown не даёт принять релиз, которому меньше трёх суток.
# Заголовки — типы из release-please-config.json, иначе проверка `title` не пропустит PR.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
